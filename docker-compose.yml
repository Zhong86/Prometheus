services:
  langflow:
    build:
      context: ./flows
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    environment:
      - LANGFLOW_AUTO_LOGIN=true
      # Keep langflow.db on the langflow_data volume; by default it lives inside
      # the image's site-packages and is wiped whenever the container is recreated.
      - LANGFLOW_CONFIG_DIR=/app/langflow
      - LANGFLOW_SAVE_DB_IN_CONFIG_DIR=true
      # Langflow turns this into a global variable at startup; the Astra DB nodes in
      # flows/Prometheus.json reference it by name instead of embedding the token.
      - ASTRA_DB_APPLICATION_TOKEN=${ASTRA_DB_TOKEN}
    env_file:
      - .env
    volumes:
      - langflow_data:/app/langflow
      - .:/app/project:ro
    command: ["langflow", "run", "--host", "0.0.0.0", "--components-path", "/app/project/flows/components"]
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - langflow
    restart: unless-stopped

volumes:
  langflow_data:
